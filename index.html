<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sensi Nivel Xit 😈</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="bg"></div>

<div class="container">

<h1>SENSI NIVEL XIT 😈</h1>

<!-- PESQUISA -->

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="pesquisa"
placeholder="Pesquise seu aparelho...">

<div id="listaPesquisa"></div>

</div>

<!-- SELECTS -->

<select id="brand">

<option value="">Selecione a marca</option>

</select>

<select id="model">

<option value="">Selecione o modelo</option>

</select>

<button id="gerarBtn">

GERAR SENSIBILIDADE ⚙️

</button>

<div id="loading" class="loading">

<div class="barra">

<div class="progresso"></div>

</div>

<p>Gerando sensibilidade...</p>

</div>

<div id="resultado">

Selecione um aparelho.

</div>

<div class="social-box">

<div class="social-item">

<i class="fab fa-instagram"></i>

<a
href="https://instagram.com/Oliveira2s"
target="_blank">

@Oliveira2s

</a>

</div>

<div class="social-item">

<i class="fab fa-tiktok"></i>

<a
href="https://tiktok.com/@oliveira2s_"
target="_blank">

@oliveira2s_

</a>

</div>

</div>

<div class="comment-box">

<h2>Comentários</h2>

<textarea
id="commentInput"
placeholder="Digite um comentário...">

</textarea>

<button id="enviarComentario">

Enviar Comentário

</button>

<div id="commentList"></div>

</div>

</div>

<script src="celulares.js"></script>

<script src="utils.js"></script>

<script src="pesquisa.js"></script>

<script src="gerador.js"></script>

<script src="comentarios.js"></script>

<script src="script.js"></script>

</body>

</html>
