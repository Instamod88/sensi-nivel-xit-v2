<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SENSI NÍVEL XIT 😈</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="bg"></div>

<div class="blur blur1"></div>
<div class="blur blur2"></div>

<div class="container">

<h1>

SENSI NÍVEL XIT 😈

</h1>

<p class="sub">

Gerador Inteligente de Sensibilidade

</p>

<div class="pesquisa">

<input

type="text"

id="pesquisa"

placeholder="Digite qualquer celular...">

</div>

<div class="linha">

<select id="brand">

<option value="">

Selecione a Marca

</option>

</select>

</div>

<div class="linha">

<select id="model">

<option value="">

Selecione o Modelo

</option>

</select>

</div>

<button

id="btn"

onclick="gerar()">

GERAR SENSIBILIDADE

</button>

<div id="loading">

<div class="loader"></div>

<p>

Calculando sensibilidade...

</p>

</div>

<div id="resultado">

Escolha um aparelho ou utilize a pesquisa.

</div>

<div class="social">

<a

href="https://www.instagram.com/oliveira2s"

target="_blank">

<i class="fab fa-instagram"></i>

<span>

@oliveira2s

</span>

</a>

<a

href="https://www.tiktok.com/@oliveira2s_"

target="_blank">

<i class="fab fa-tiktok"></i>

<span>

@oliveira2s_

</span>

</a>

</div>

<div class="circle">

<div class="ring ring1"></div>

<div class="ring ring2"></div>

<div class="ring ring3"></div>

<div class="center">

<i class="fab fa-instagram"></i>

<i class="fab fa-tiktok"></i>

<p>

OLIVEIRA2S

</p>

</div>

</div>

<div class="comentarios">

<h2>

Comentários

</h2>

<textarea

id="commentInput"

rows="4"

placeholder="Escreva seu comentário...">

</textarea>

<button

onclick="addComment()">

Enviar

</button>

<div

id="commentList">

</div>

</div>

</div>

<script src="celulares.js"></script>

<script src="gerador.js"></script>

<script src="pesquisa.js"></script>

<script src="script.js"></script>

</body>

</html>
